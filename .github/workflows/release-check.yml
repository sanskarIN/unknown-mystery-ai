name: Release Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "projects/**"
      - "scripts/check_release_candidate.py"
      - "scripts/check_repository_completeness.py"
      - "scripts/check_project*.py"
      - "scripts/check_release_documentation.py"
      - "scripts/check_workflow_pins.py"
      - "pyproject.toml"
      - "api/**"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - "README.md"
      - "docs/COMPANION_RELEASE_1.1.0.md"
      - "docs/RELEASE_1_1_0_CHECKLIST.md"
      - "docs/RELEASE_RUNBOOK.md"
      - "docs/RELEASE_STATUS.md"
      - "docs/RC_1_1_0_VERIFICATION.md"
      - ".github/workflows/publish-stable.yml"
      - ".github/workflows/release-assets.yml"
      - ".github/workflows/release-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate repository completeness
        run: python scripts/check_repository_completeness.py

      - name: Validate release documentation
        run: python scripts/check_release_documentation.py

      - name: Validate pinned workflow actions
        run: python scripts/check_workflow_pins.py

      - name: Validate release candidate invariants
        run: python scripts/check_release_candidate.py

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate project catalog
        run: python scripts/check_project_catalog.py

      - name: Smoke-test projects
        run: python scripts/check_projects.py

      - name: Validate capstone snapshots
        run: python scripts/check_project_snapshots.py

      - name: Build source and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Verify distribution contents
        run: python scripts/check_distribution_contents.py

      - name: Verify installed dependency state
        run: python -m pip check

