name: Release Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "projects/**"
      - "scripts/check_release_candidate.py"
      - "scripts/check_project*.py"
      - "pyproject.toml"
      - "api/**"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - "README.md"
      - "docs/COMPANION_RELEASE_1.1.0.md"
      - "docs/RELEASE_1_1_0_CHECKLIST.md"
      - "docs/RC_1_1_0_VERIFICATION.md"
      - ".github/workflows/release-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate release candidate invariants
        run: python scripts/check_release_candidate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate project catalog
        run: python scripts/check_project_catalog.py
      - name: Smoke-test projects
        run: python scripts/check_projects.py
      - name: Validate capstone snapshots
        run: python scripts/check_project_snapshots.py
      - name: Build source and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify package metadata
        run: python -m pip check

