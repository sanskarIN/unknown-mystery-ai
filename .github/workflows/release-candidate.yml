name: Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate metadata
        run: python scripts/check_package_metadata.py
      - name: Install package
        run: python -m pip install -e .
      - name: Validate stable public API snapshot
        run: python scripts/check_public_api.py --require-version-match
      - name: Validate documentation links
        run: python scripts/check_markdown_links.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run examples
        run: |
          for file in examples/[0-9][0-9]_*.py; do
            echo "==> $file"
            python "$file"
          done
      - name: Build release candidate
        run: |
          python -m pip install build
          python -m build
      - name: Generate SHA-256 manifest
        run: python scripts/create_checksum_manifest.py dist/* > dist/SHA256SUMS.txt
      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umai-release-candidate
          path: dist/
          if-no-files-found: error

# Official publication: https://ramsandesh.gumroad.com
