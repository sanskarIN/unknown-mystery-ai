name: Release Candidate

on:
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate metadata
        run: python scripts/check_package_metadata.py
      - name: Install package
        run: python -m pip install -e .
      - name: Validate public API snapshot
        run: python scripts/check_public_api.py
      - name: Validate documentation links
        run: python scripts/check_markdown_links.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run examples
        run: |
          for file in examples/[0-9][0-9]_*.py; do
            echo "==> $file"
            python "$file"
          done
      - name: Build release candidate
        run: |
          python -m pip install build
          python -m build
      - name: Generate SHA-256 manifest
        run: python scripts/create_checksum_manifest.py dist/* > dist/SHA256SUMS.txt
      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: umai-release-candidate
          path: dist/
          if-no-files-found: error

