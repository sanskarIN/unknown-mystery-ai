name: Attach Stable Release Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-assets.yml"

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable v1.0.0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v1.0.0
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify tag version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          test "$VERSION" = "1.0.0"

      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build

      - name: Generate SHA-256 checksums
        run: |
          python scripts/create_checksum_manifest.py dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v1.0.0
          gh release upload v1.0.0 dist/* --clobber

# Release software is built from the immutable v1.0.0 tag, not post-release main.
# The paid eBook/commercial assets are intentionally excluded.
# Official publication: https://ramsandesh.gumroad.com
