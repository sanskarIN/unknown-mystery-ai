name: Attach Stable Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag and package version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          TAG="${{ steps.release.outputs.tag }}"
          test "$TAG" = "v$VERSION"
          test -f "docs/COMPANION_RELEASE_${VERSION}.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release source
        run: |
          python scripts/check_repository_completeness.py
          python scripts/check_package_metadata.py
          python scripts/check_release_documentation.py
          python scripts/check_public_repository_boundary.py
          python scripts/check_public_api.py --require-version-match
          python scripts/check_project_catalog.py
          python -m unittest discover -s tests -v
          python scripts/check_projects.py
          python scripts/check_project_snapshots.py

      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify distribution contents
        run: python scripts/check_distribution_contents.py

      - name: Generate SHA-256 checksums
        run: |
          python scripts/create_checksum_manifest.py dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh release view "$TAG"
          gh release upload "$TAG" dist/* --clobber

# Release software is built from the immutable published tag, never post-release main.
# Paid eBook/commercial assets are intentionally excluded.
# Official publication: https://ramsandesh.gumroad.com
