name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate metadata
        run: python scripts/check_package_metadata.py
      - name: Validate release documentation
        run: python scripts/check_release_documentation.py
      - name: Validate pinned GitHub Actions
        run: python scripts/check_workflow_pins.py
      - name: Validate public repository publication boundary
        run: python scripts/check_public_repository_boundary.py
      - name: Validate canonical project links
        run: python scripts/check_project_links.py
      - name: Validate internal Markdown links
        run: python scripts/check_markdown_links.py
      - name: Install package
        run: python -m pip install -e .
      - name: Validate stable public API snapshot
        run: python scripts/check_public_api.py --require-version-match
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run examples
        run: |
          for file in examples/[0-9][0-9]_*.py; do
            echo "==> $file"
            python "$file"
          done
      - name: Smoke-test companion projects
        run: python scripts/check_projects.py
      - name: Build package
        run: |
          python -m pip install build
          python -m build
      - name: Verify distribution contents
        run: python scripts/check_distribution_contents.py
      - name: Create checksums
        run: python scripts/create_checksum_manifest.py dist/* > dist/SHA256SUMS.txt
      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-build-evidence
          path: dist/
          if-no-files-found: error

# Official publication: https://ramsandesh.gumroad.com
