name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate metadata
        run: python scripts/check_package_metadata.py
      - name: Validate internal Markdown links
        run: python scripts/check_markdown_links.py
      - name: Install package
        run: python -m pip install -e .
      - name: Validate stable public API snapshot
        run: python scripts/check_public_api.py --require-version-match
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run examples
        run: |
          for file in examples/[0-9][0-9]_*.py; do
            echo "==> $file"
            python "$file"
          done
      - name: Build package
        run: |
          python -m pip install build
          python -m build
      - name: Create checksums
        run: python scripts/create_checksum_manifest.py dist/* > dist/SHA256SUMS.txt
      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-build-evidence
          path: dist/
          if-no-files-found: error

