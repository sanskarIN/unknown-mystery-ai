name: Project Matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  projects:
    name: Projects - ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install companion
        run: python -m pip install -e .

      - name: Smoke-test all companion projects
        run: python scripts/check_projects.py

      - name: Validate capstone snapshot fixtures
        run: python scripts/check_project_snapshots.py

      - name: Show official book store
        run: python -c "print('https://ramsandesh.gumroad.com')"
