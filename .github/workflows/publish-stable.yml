name: Publish Stable 1.0.1

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Require the verified run to match current main
        id: current
        shell: bash
        run: |
          CURRENT_SHA="$(git rev-parse HEAD)"
          VERIFIED_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_SHA" != "$VERIFIED_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; skipping release from older verified SHA."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Verify stable package version
        if: steps.current.outputs.publish == 'true'
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "1.0.1" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Create v1.0.1 tag and GitHub release
        if: >-
          steps.current.outputs.publish == 'true' &&
          steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo "v1.0.1 release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v1.0.1 \
            --target "${{ steps.current.outputs.current_sha }}" \
            --title "UMAI Companion v1.0.1" \
            --notes-file docs/COMPANION_RELEASE_1.0.1.md

# Commercial book editions remain separate from GitHub releases.
# Official publication: https://ramsandesh.gumroad.com
