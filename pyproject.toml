[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unknown-mystery-ai"
version = "0.4.0"
description = "Open-source companion utilities for The Unknown Mystery of the AI by Ram Sandesh"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Ram Sandesh", email = "sanskarin@outlook.in"}
]
keywords = [
  "artificial-intelligence",
  "machine-learning",
  "deep-learning",
  "llm",
  "rag",
  "agents",
  "mlops",
  "responsible-ai",
  "ai-evaluation",
  "ai-education"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/sanskarIN/unknown-mystery-ai"
Repository = "https://github.com/sanskarIN/unknown-mystery-ai"
Documentation = "https://github.com/sanskarIN/unknown-mystery-ai/tree/main/docs"
Store = "https://ramsandesh.gumroad.com"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
